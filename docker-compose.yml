# Brewing Intelligence & Competition OS — Epic 1
# Persistent data uses host bind mounts (NAS-friendly). Override paths via .env.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brewingos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewingos}
      POSTGRES_DB: ${POSTGRES_DB:-brewingos}
    volumes:
      - ${BREWINGOS_POSTGRES_DATA:-./data/postgres}:/var/lib/postgresql/data
    # Not published to the host by default (Epic security).
    # Set POSTGRES_PORT and uncomment ports for local debugging only.
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brewingos} -d ${POSTGRES_DB:-brewingos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-brewingos}:${POSTGRES_PASSWORD:-brewingos}@postgres:5432/${POSTGRES_DB:-brewingos}
      BREWINGOS_ENV: ${BREWINGOS_ENV:-development}
      BREWINGOS_SECRET_KEY: ${BREWINGOS_SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STORAGE_PATH: /BrewingOS/storage
      LOG_PATH: /BrewingOS/logs
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ${BREWINGOS_STORAGE:-./data/storage}:/BrewingOS/storage
      - ${BREWINGOS_LOGS:-./data/logs}:/BrewingOS/logs
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brewingos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewingos}
      POSTGRES_DB: ${POSTGRES_DB:-brewingos}
      PGPASSWORD: ${POSTGRES_PASSWORD:-brewingos}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-brewingos}
      PGDATABASE: ${POSTGRES_DB:-brewingos}
    volumes:
      - ${BREWINGOS_BACKUPS:-./data/backups}:/BrewingOS/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "BrewingOS backup sidecar ready."
        echo "Example: pg_dump -Fc > /BrewingOS/backups/brewingos-$$(date +%Y%m%d).dump"
        sleep infinity
    profiles:
      - backup

networks:
  default:
    name: brewingos_net
