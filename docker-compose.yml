# Brewing Intelligence & Competition OS
# Isolated Compose project — do not share networks/volumes with investing/AEGIS/CODEX.

name: brewingos

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brewingos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewingos}
      POSTGRES_DB: ${POSTGRES_DB:-brewingos}
    volumes:
      - ${BREWINGOS_POSTGRES_DATA:-./data/postgres}:/var/lib/postgresql/data
    # Never publish Postgres to the host for NAS/production.
    networks:
      - brewingos-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brewingos} -d ${POSTGRES_DB:-brewingos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-brewingos}:${POSTGRES_PASSWORD:-brewingos}@postgres:5432/${POSTGRES_DB:-brewingos}
      BREWINGOS_ENV: ${BREWINGOS_ENV:-development}
      BREWINGOS_SECRET_KEY: ${BREWINGOS_SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:18181,http://localhost:18181}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STORAGE_PATH: /BrewingOS/storage
      LOG_PATH: /BrewingOS/logs
    ports:
      # Reserved BrewingOS bring-up ports — outside AEGIS/investing ranges.
      # Prefer binding to loopback on NAS and exposing via Tailscale Serve.
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-18182}:8000"
    volumes:
      - ${BREWINGOS_STORAGE:-./data/storage}:/BrewingOS/storage
      - ${BREWINGOS_LOGS:-./data/logs}:/BrewingOS/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - brewingos-app
      - brewingos-data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:18182}
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-18181}:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - brewingos-edge
      - brewingos-app
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brewingos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewingos}
      POSTGRES_DB: ${POSTGRES_DB:-brewingos}
      PGPASSWORD: ${POSTGRES_PASSWORD:-brewingos}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-brewingos}
      PGDATABASE: ${POSTGRES_DB:-brewingos}
    volumes:
      - ${BREWINGOS_BACKUPS:-./data/backups}:/BrewingOS/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - brewingos-data
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "BrewingOS backup sidecar ready."
        echo "Example: pg_dump -Fc > /BrewingOS/backups/brewingos-$$(date +%Y%m%d).dump"
        sleep infinity
    profiles:
      - backup

networks:
  brewingos-edge:
    name: brewingos-edge
  brewingos-app:
    name: brewingos-app
  brewingos-data:
    name: brewingos-data
    internal: true
