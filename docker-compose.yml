name: brewing-platform

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brewing}
      POSTGRES_USER: ${POSTGRES_USER:-brewing_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example and set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://brewing_app:${POSTGRES_PASSWORD}@db:5432/brewing}
      REDIS_URL: redis://redis:6379/0
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-brewer}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
      PHASE3_RATE_LIMIT_MUTATIONS: ${PHASE3_RATE_LIMIT_MUTATIONS:-500}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:18101,http://web:3000}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:18101}
      MEDIA_ROOT: /var/lib/brewing/media
    volumes:
      - brewing_media:/var/lib/brewing/media
    ports:
      - "127.0.0.1:${API_PORT:-18100}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [internal, edge]

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Brewing Platform}
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${WEB_PORT:-18101}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [edge]

  e2e:
    build:
      context: .
      dockerfile: infrastructure/docker/e2e.Dockerfile
    profiles: [test]
    environment:
      BASE_URL: http://web:3000
      E2E_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-brewer}
      E2E_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
    command: ["npm", "test"]
    depends_on:
      web:
        condition: service_healthy
    networks: [edge]

volumes:
  postgres_data:
  brewing_media:

networks:
  internal:
    internal: true
  edge:
