name: Phase 1A CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: sqlite+pysqlite:///./.test-brewing.db
      REDIS_URL: redis://localhost:6379/15
      BOOTSTRAP_ADMIN_USERNAME: brewer
      BOOTSTRAP_ADMIN_PASSWORD: ci-test-password
      SESSION_SECRET: ci-test-session-secret-with-at-least-32-characters
      PYTHONPATH: ${{ github.workspace }}/apps/api:${{ github.workspace }}/packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check . ../../database/migrations
      - run: pytest -q

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: brewing
          POSTGRES_USER: brewing_app
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brewing_app -d brewing"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+psycopg://brewing_app:ci-postgres-password@localhost:5432/brewing
      REDIS_URL: redis://localhost:6379/15
      BOOTSTRAP_ADMIN_USERNAME: brewer
      BOOTSTRAP_ADMIN_PASSWORD: ci-test-password
      SESSION_SECRET: ci-test-session-secret-with-at-least-32-characters
      TEST_USE_POSTGRES: "1"
      PYTHONPATH: ${{ github.workspace }}/apps/api:${{ github.workspace }}/packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: pytest -q tests/test_postgres_integrity.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm test
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          POSTGRES_PASSWORD=ci-postgres-password \
          BOOTSTRAP_ADMIN_PASSWORD=ci-test-password \
          SESSION_SECRET=ci-test-session-secret-with-at-least-32-characters \
          docker compose up -d --build db redis api web
      - run: |
          POSTGRES_PASSWORD=ci-postgres-password \
          BOOTSTRAP_ADMIN_PASSWORD=ci-test-password \
          SESSION_SECRET=ci-test-session-secret-with-at-least-32-characters \
          docker compose --profile test run --rm --build e2e

