# Optional local bind mounts for development when the repo is on a *local* disk.
# Do not use with \\NazarioNAS SMB/USB paths — Docker Desktop mounts are unreliable there.
#
# Usage (local disk clone only):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  backend:
    volumes:
      - ./backend:/app
      - ${BREWINGOS_STORAGE:-./data/storage}:/BrewingOS/storage
      - ${BREWINGOS_LOGS:-./data/logs}:/BrewingOS/logs
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    volumes:
      - ./frontend:/app
      - /app/node_modules
